name: qoder
services:
  qoder:
    build: .
    container_name: qoder
    restart: unless-stopped
    environment:
      - PORT=4000
      - QODER_RATE_LIMIT_PATH=/data/rate-limits.json
    volumes:
      - ./data:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:4000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
networks:
  proxy:
    external: true